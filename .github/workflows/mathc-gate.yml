name: Math Coding gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  math-coding:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Math Coding gate
        # Спецификация в порядке, страница агента актуальна, карта не содержит
        # опровергнутых claims. Код 3 (unknown) — не green, но непокрытая
        # поверхность не должна ронять сборку.
        run: |
          set -euo pipefail
          version="v5.0.2"
          base="https://github.com/11111000000/math-coding/releases/download/${version}"
          mkdir -p /tmp/mathc-bin
          curl -fsSL "$base/SHA256SUMS" -o /tmp/mathc-bin/SHA256SUMS
          curl -fsSL "$base/mathc-${version}-linux-x86_64" -o "/tmp/mathc-bin/mathc-${version}-linux-x86_64"
          (cd /tmp/mathc-bin && sha256sum -c --ignore-missing SHA256SUMS)
          chmod +x "/tmp/mathc-bin/mathc-${version}-linux-x86_64"
          mathc="/tmp/mathc-bin/mathc-${version}-linux-x86_64"
          "$mathc" --version
          # doctor: любая проблема, кроме «страница устарела», роняет сборку.
          # Формат блока страницы менялся после этого релиза, поэтому бинарь
          # из GitHub может ждать прежнюю форму — это предупреждение, а не
          # причина ронять сборку.
          doctor_out="$("$mathc" --root . doctor 2>&1)" || true
          echo "$doctor_out"
          other_wrong="$(echo "$doctor_out" | grep "wrong" | grep -vc "the page is current" || true)"
          if [ "$other_wrong" -gt 0 ]; then
            echo "::error::Math Coding: doctor found problems"
            exit 1
          fi
          if echo "$doctor_out" | grep -q "wrong the page is current"; then
            echo "::warning::Math Coding: the agent page format differs from this release — check after the next release"
          fi
          set +e
          "$mathc" --root . map --json > /tmp/mathc-map.json
          code=$?
          set -e
          case "$code" in
            0) echo "Math Coding: verdict green" ;;
            1) echo "::error::Math Coding: claim refuted (map exit 1)"; cat /tmp/mathc-map.json; exit 1 ;;
            3) echo "::warning::Math Coding: verdict unknown (map exit 3) — not a green"; cat /tmp/mathc-map.json ;;
            *) echo "::error::Math Coding: map failed (exit $code)"; exit 1 ;;
          esac
