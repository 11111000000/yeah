<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Yeah — The agent is Emacs</title>
  <desc id="desc">A dark Emacs frame with a Yeah session, mode line and the phrase The agent is Emacs.</desc>
  <rect width="1200" height="630" fill="#000000"/>
  <rect x="40" y="35" width="1120" height="560" fill="#1a1a1a" stroke="#404040"/>
  <rect x="41" y="36" width="1118" height="48" fill="#262626"/>
  <line x1="41" y1="84" x2="1159" y2="84" stroke="#404040"/>

  <g font-family="DejaVu Sans Mono, monospace">
    <text x="62" y="69" fill="#dda0dd" font-size="27">(</text>
    <g transform="translate(76 46) scale(.58)" fill="none" stroke="#dda0dd" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 9 L24 27 L40 9"/><circle cx="24" cy="27" r="4.6"/><path d="M24 31.6 L24 40"/>
      <circle cx="8" cy="9" r="2.6" fill="#dda0dd"/><circle cx="40" cy="9" r="2.6" fill="#dda0dd"/>
    </g>
    <text x="108" y="68" fill="#e6e6e6" font-size="19" font-weight="bold">yeah</text>
    <text x="155" y="69" fill="#dda0dd" font-size="27">)</text>
    <text x="710" y="65" fill="#a6a6a6" font-size="12">WHY EMACS   ARCHITECTURE   STATUS</text>
    <text x="1040" y="65" fill="#dda0dd" font-size="12">[ source ]</text>

    <rect x="41" y="85" width="1118" height="31" fill="#000000"/>
    <text x="62" y="105" fill="#999999" font-size="11">GNU Emacs · Yeah 0.1.0-alpha</text>
    <text x="878" y="105" fill="#999999" font-size="11">Elisp · service-first · append-only</text>

    <text x="74" y="159" fill="#999999" font-size="13">;; Yeah, Emacs Agent Harness</text>
    <text x="70" y="232" fill="#e6e6e6" font-size="51" letter-spacing="-3">The agent <tspan fill="#dda0dd">is</tspan></text>
    <text x="69" y="317" fill="#add8e6" font-size="78" letter-spacing="-5">Emacs.</text>
    <text x="74" y="366" fill="#a6a6a6" font-size="15">An inspectable agent harness written in Emacs Lisp.</text>
    <text x="74" y="393" fill="#a6a6a6" font-size="15">Live buffers. Permissioned tools. Durable events.</text>

    <rect x="74" y="433" width="180" height="42" fill="#dda0dd"/>
    <text x="88" y="459" fill="#000000" font-size="13" font-weight="bold">[ install alpha ]</text>
    <rect x="74" y="499" width="45" height="20" fill="#f0e68c"/>
    <text x="80" y="513" fill="#000000" font-size="10" font-weight="bold">ALPHA</text>
    <text x="130" y="513" fill="#999999" font-size="11">Kernel prototype · public alpha gate open</text>

    <rect x="640" y="142" width="470" height="365" fill="#000000" stroke="#595959"/>
    <rect x="641" y="143" width="468" height="40" fill="#262626"/>
    <text x="658" y="168" fill="#d8bfd8" font-size="13">*yeah*</text>
    <text x="965" y="168" fill="#999999" font-size="10">illustrative session</text>

    <text x="660" y="214" fill="#add8e6" font-size="12" font-weight="bold">you</text>
    <text x="716" y="214" fill="#e6e6e6" font-size="12">Fix the failing canary.</text>
    <line x1="658" y1="230" x2="1092" y2="230" stroke="#333333" stroke-dasharray="3 4"/>

    <text x="660" y="259" fill="#b0c4de" font-size="12" font-weight="bold">Read</text>
    <text x="716" y="259" fill="#e6e6e6" font-size="12">tests/checks/canary.el</text>
    <text x="716" y="276" fill="#999999" font-size="10">bounded · read-only</text>
    <line x1="658" y1="291" x2="1092" y2="291" stroke="#333333" stroke-dasharray="3 4"/>

    <text x="660" y="320" fill="#b0c4de" font-size="12" font-weight="bold">Edit</text>
    <text x="716" y="320" fill="#e6e6e6" font-size="12">lib/yeah-session.el</text>
    <text x="716" y="337" fill="#999999" font-size="10">exact match · modification tick verified</text>
    <line x1="658" y1="352" x2="1092" y2="352" stroke="#333333" stroke-dasharray="3 4"/>

    <text x="660" y="381" fill="#f0e68c" font-size="12" font-weight="bold">Build</text>
    <text x="716" y="381" fill="#e6e6e6" font-size="12">Approve guarded edit?</text>
    <text x="716" y="399" fill="#f0e68c" font-size="10">[ once ]  [ session ]  [ deny ]</text>
    <line x1="658" y1="414" x2="1092" y2="414" stroke="#333333" stroke-dasharray="3 4"/>

    <text x="660" y="444" fill="#b0c4de" font-size="12" font-weight="bold">ERT</text>
    <text x="716" y="444" fill="#98fb98" font-size="12" font-weight="bold">PASS</text>
    <text x="764" y="444" fill="#e6e6e6" font-size="12">— canary repaired</text>
    <rect x="641" y="471" width="468" height="35" fill="#000000"/>
    <line x1="641" y1="471" x2="1109" y2="471" stroke="#404040"/>
    <text x="658" y="493" fill="#dda0dd" font-size="12">M-x <tspan fill="#e6e6e6">yeah</tspan></text>
    <rect x="713" y="483" width="7" height="13" fill="#98fb98"/>

    <rect x="41" y="555" width="1118" height="39" fill="#d8bfd8"/>
    <text x="60" y="579" fill="#000000" font-size="12">-:-   *scratch*</text>
    <text x="895" y="579" fill="#000000" font-size="12">All   L1   (Elisp)   alpha</text>
  </g>
</svg>
