-- the machine</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="356.4141" x="422.5977" y="223.8516">of the states of a run is the picture</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="154.125" x="422.5977" y="242.4766">beside this one)</text><rect fill="#000000" height="75.875" rx="12.5" ry="12.5" style="stroke:#646464;stroke-width:0.5;" width="414.9453" x="436.6797" y="276.25"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="288.9844" x="446.6797" y="301.1016">the model proposes a tool call</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="394.9453" x="446.6797" y="319.7266">(read, edit, bash, git_status, todo_list)</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="202.2891" x="446.6797" y="338.3516">lib/yeah-turn.el:1099</text><rect fill="#000000" height="75.875" rx="12.5" ry="12.5" style="stroke:#646464;stroke-width:0.5;" width="289.7188" x="499.293" y="372.125"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="269.7188" x="509.293" y="396.9766">the registry checks the call</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="221.5547" x="509.293" y="415.6016">(type, name, arguments)</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="202.2891" x="509.293" y="434.2266">lib/yeah-tools.el:435</text><rect fill="#000000" height="75.875" rx="12.5" ry="12.5" style="stroke:#646464;stroke-width:0.5;" width="212.6563" x="537.8242" y="468"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="173.3906" x="547.8242" y="492.8516">the policy decides</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="192.6563" x="547.8242" y="511.4766">(may this call run?)</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="192.6563" x="547.8242" y="530.1016">lib/yeah-perm.el:528</text><polygon fill="#000000" points="528.5586,563.875,759.7461,563.875,771.7461,575.875,759.7461,587.875,528.5586,587.875,516.5586,575.875,528.5586,563.875" style="stroke:#646464;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="231.1875" x="528.5586" y="581.4141">the rules ask the person</text><text fill="#989898" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="28.8984" x="487.6602" y="572.1016">yes</text><text fill="#989898" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="19.2656" x="771.7461" y="572.1016">no</text><rect fill="#000000" height="75.875" rx="12.5" ry="12.5" style="stroke:#646464;stroke-width:0.5;" width="636.5" x="11" y="597.875"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="288.9844" x="21" y="622.7266">the request goes to the person</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="616.5" x="21" y="641.3516">the human answers: :once, :session, :project, :global or :reject</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="221.5547" x="21" y="659.9766">lib/yeah-approval.el:59</text><polygon fill="#000000" points="247.3711,708.75,411.1289,708.75,423.1289,720.75,411.1289,732.75,247.3711,732.75,235.3711,720.75,247.3711,708.75" style="stroke:#646464;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="163.7578" x="247.3711" y="726.2891">the answer allows</text><text fill="#989898" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="28.8984" x="206.4727" y="716.9766">yes</text><text fill="#989898" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="19.2656" x="423.1289" y="716.9766">no</text><rect fill="#000000" height="38.625" rx="12.5" ry="12.5" style="stroke:#646464;stroke-width:0.5;" width="174.125" x="89.7363" y="742.75"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="154.125" x="99.7363" y="767.6016">the call may run</text><rect fill="#000000" height="75.875" rx="12.5" ry="12.5" style="stroke:#646464;stroke-width:0.5;" width="395.6797" x="283.8613" y="742.75"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="183.0234" x="293.8613" y="767.6016">the call is refused</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="375.6797" x="293.8613" y="786.2266">(the refusal is the result of the call)</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="192.6563" x="293.8613" y="804.8516">lib/yeah-turn.el:474</text><polygon fill="#000000" points="329.25,824.625,341.25,836.625,329.25,848.625,317.25,836.625,329.25,824.625" style="stroke:#646464;stroke-width:0.5;"/><polygon fill="#000000" points="872.3594,597.875,1045.75,597.875,1057.75,609.875,1045.75,621.875,872.3594,621.875,860.3594,609.875,872.3594,597.875" style="stroke:#646464;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="173.3906" x="872.3594" y="615.4141">the rules allow it</text><text fill="#989898" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="28.8984" x="831.4609" y="606.1016">yes</text><text fill="#989898" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust=