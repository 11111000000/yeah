<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="750px" preserveAspectRatio="none" style="width:941px;height:750px;background:#FFFFFF;" version="1.1" viewBox="0 0 941 750" width="941px" zoomAndPan="magnify"><defs/><g><ellipse cx="290.7188" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="511.2734" x="35.082" y="50"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="491.2734" x="45.082" y="74.8516">the gate of the project runs the checks of the tree</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="346.7813" x="45.082" y="93.4766">and binds the evidence to the claims</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="115.5938" x="45.082" y="112.1016">scripts/gate</text><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="520.9063" x="30.2656" y="145.875"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="38.5313" x="40.2656" y="170.7266">unit</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="500.9063" x="40.2656" y="189.3516">(pure transitions, validation, projections, helpers)</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="96.3281" x="40.2656" y="207.9766">tests/unit</text><rect fill="#FFFFFF" height="94.5" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="559.4375" x="11" y="241.75"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="163.7578" x="21" y="266.6016">contract / canary</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="539.4375" x="21" y="285.2266">(the failure classes and the invariants named by claims,</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="472.0078" x="21" y="303.8516">each with a control that can make the check fail)</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="115.5938" x="21" y="322.4766">tests/checks</text><rect fill="#FFFFFF" height="94.5" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="463.1094" x="59.1641" y="356.25"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="105.9609" x="69.1641" y="381.1016">integration</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="443.1094" x="69.1641" y="399.7266">(real gptel, process and protocol round trips,</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="433.4766" x="69.1641" y="418.3516">restart, recovery, the whole coding scenario)</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="260.0859" x="69.1641" y="436.9766">tests/checks and tests/live</text><rect fill="#FFFFFF" height="94.5" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="492.0078" x="44.7148" y="470.75"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="163.7578" x="54.7148" y="495.6016">live / evaluation</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="472.0078" x="54.7148" y="514.2266">(pinned real providers, comparative tasks against</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="346.7813" x="54.7148" y="532.8516">opencode and pi, Emacs-native tasks)</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="96.3281" x="54.7148" y="551.4766">tests/live</text><path d="M513.375,575.25 L513.375,632.125 L493.375,636.125 L513.375,640.125 L513.375,697 A0,0 0 0 0 513.375,697 L929.3203,697 A0,0 0 0 0 929.3203,697 L929.3203,585.25 L919.3203,575.25 L513.375,575.25 A0,0 0 0 0 513.375,575.25" fill="#F2F2F2" style="stroke:#999999;stroke-width:0.5;"/><path d="M919.3203,575.25 L919.3203,585.25 L929.3203,585.25 L919.3203,575.25" fill="#F2F2F2" style="stroke:#999999;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="375.6797" x="519.375" y="595.1016">This picture does not show the work the</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="385.3125" x="519.375" y="613.7266">levels ran on.  Still open at the top of</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="327.5156" x="519.375" y="632.3516">the ladder: no real ACP editor has</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="394.9453" x="519.375" y="650.9766">finished a task, the clean bootstrap does</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="346.7813" x="519.375" y="669.6016">not run in CI, and the bridge is off</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="288.9844" x="519.375" y="688.2266">until the operator enables it.</text><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="405.3125" x="88.0625" y="598.1875"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="240.8203" x="98.0625" y="623.0391">the boundary of the proof</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="346.7813" x="98.0625" y="641.6641">(every level proves its own subject,</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="385.3125" x="98.0625" y="660.2891">a green module is not a working product)</text><ellipse cx="290.7188" cy="728" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="290.7188" cy="728" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#333333;stroke-width:1;" x1="290.7188" x2="290.7188" y1="30" y2="50"/><polygon fill="#333333" points="286.7188,40,290.7188,50,294.7188,40,290.7188,44" style="stroke:#333333;stroke-width:1;"/><line style="stroke:#333333;stroke-width:1;" x1="290.7188" x2="290.7188" y1="125.875" y2="145.875"/><polygon fill="#333333" points="286.7188,135.875,290.7188,145.875,294.7188,135.875,290.7188,139.875" style="stroke:#333333;stroke-width:1;"/><line style="stroke:#333333;stroke-width:1;" x1="290.7188" x2="290.7188" y1="221.75" y2="241.75"/><polygon fill="#333333" points="286.7188,231.75,290.7188,241.75,294.7188,231.75,290.7188,235.75" style="stroke:#333333;stroke-width:1;"/><line style="stroke:#333333;stroke-width:1;" x1="290.7188" x2="290.7188" y1="336.25" y2="356.25"/><polygon fill="#333333" points="286.7188,346.25,290.7188,356.25,294.7188,346.25,290.7188,350.25" style="stroke:#333333;stroke-width:1;"/><line style="stroke:#333333;stroke-width:1;" x1="290.7188" x2="290.7188" y1="450.75" y2="470.75"/><polygon fill="#333333" points="286.7188,460.75,290.7188,470.75,294.7188,460.75,290.7188,464.75" style="stroke:#333333;stroke-width:1;"/><line style="stroke:#333333;stroke-width:1;" x1="290.7188" x2="290.7188" y1="565.25" y2="598.1875"/><polygon fill="#333333" points="286.7188,588.1875,290.7188,598.1875,294.7188,588.1875,290.7188,592.1875" styl