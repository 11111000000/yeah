hAdjust="spacing" textLength="84.2871" x="830.93" y="298.5851">MCP server</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="14" lengthAdjust="spacing" textLength="160.1455" x="830.93" y="314.882">lib/yeah-mcp.el:173</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="14" lengthAdjust="spacing" textLength="160.1455" x="830.93" y="331.1789">lib/yeah-mcp.el:192</text></g><!--entity stdio--><g class="entity" data-entity="stdio" data-source-line="59" data-uid="ent0007" id="entity_stdio"><rect fill="#000000" height="68.8906" rx="2.5" ry="2.5" style="stroke:#646464;stroke-width:0.5;" width="197.0029" x="553.5" y="421.48"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="14" lengthAdjust="spacing" textLength="126.4307" x="563.5" y="444.4751">stdio transport</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="14" lengthAdjust="spacing" textLength="177.0029" x="563.5" y="460.772">one request at a time</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="14" lengthAdjust="spacing" textLength="160.1455" x="563.5" y="477.0689">lib/yeah-wire.el:23</text></g><!--entity socket--><g class="entity" data-entity="socket" data-source-line="61" data-uid="ent0008" id="entity_socket"><rect fill="#000000" height="68.8906" rx="2.5" ry="2.5" style="stroke:#646464;stroke-width:0.5;" width="239.1465" x="791.43" y="421.48"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="14" lengthAdjust="spacing" textLength="185.4316" x="801.43" y="444.4751">local socket transport</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="14" lengthAdjust="spacing" textLength="210.7178" x="801.43" y="460.772">a connection is a process</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="14" lengthAdjust="spacing" textLength="219.1465" x="801.43" y="477.0689">lib/yeah-wire-socket.el:57</text></g><!--entity acp_clients--><g class="entity" data-entity="acp_clients" data-source-line="69" data-uid="ent0011" id="entity_acp_clients"><rect fill="#000000" height="52.5938" rx="2.5" ry="2.5" style="stroke:#646464;stroke-width:0.5;" width="230.7178" x="525.64" y="7"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="14" lengthAdjust="spacing" textLength="92.7158" x="535.64" y="29.9951">ACP clients</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="14" lengthAdjust="spacing" textLength="210.7178" x="535.64" y="46.292">orchestrators and editors</text></g><!--entity mcp_clients--><g class="entity" data-entity="mcp_clients" data-source-line="71" data-uid="ent0012" id="entity_mcp_clients"><rect fill="#000000" height="52.5938" rx="2.5" ry="2.5" style="stroke:#646464;stroke-width:0.5;" width="239.1465" x="791.43" y="7"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="14" lengthAdjust="spacing" textLength="92.7158" x="801.43" y="29.9951">MCP clients</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="14" lengthAdjust="spacing" textLength="219.1465" x="801.43" y="46.292">tools of the outside world</text></g><g class="entity" data-entity="GMN21" data-source-line="83" data-uid="ent0022" id="entity_GMN21"><path d="M1602,585.37 L1602,671.0341 L2209.9995,671.0341 L2209.9995,595.37 L2199.9995,585.37 L1602,585.37" fill="#1E1E1E" style="stroke:#646464;stroke-width:0.5;"/><path d="M2199.9995,585.37 L2199.9995,595.37 L2209.9995,595.37 L2199.9995,585.37" fill="#1E1E1E" style="stroke:#646464;stroke-width:1;"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="13" lengthAdjust="spacing" textLength="586.9995" x="1608" y="602.4369">The honest limit of the wire: on stdio the transport reads its input with a</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="13" lengthAdjust="spacing" textLength="563.5195" x="1608" y="617.5697">blocking read, so the event loop of Emacs does not run while a prompt is</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="13" lengthAdjust="spacing" textLength="563.5195" x="1608" y="632.7025">running, and a cancel cannot interrupt that prompt.  On the local socket</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="13" lengthAdjust="spacing" textLength="579.1729" x="1608" y="647.8353">the connection is a process, the event loop keeps running, and a cancel is</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="13" lengthAdjust="spacing" textLength="328.7197" x="1608" y="662.9681">handled while the prompt is still running.</text></g><!--link acp_clients to acp_server--><g class="link" data-entity-1="acp_clients" data-entity-2="acp_server" data-source-line="73" data-uid="lnk13" id="link_acp_clients_acp_server"><path d="M641,59.65 C641,109.33 641,213.5 641,269.28" fill="none" id="acp_clients-to-acp_server" style="stroke:#989898;stroke-width:1;"/><polygon fill="#989898" points="641,275.28,645,266.28,641,270.28,637,266.28,641,275.28" style="stroke:#989898;stroke-width:1;"/><text fill="#989898" font-family="'DejaVu Sans Mono'" font-size="13" lengthAdjust="spacing" textLength="23.48" x="642" y="102.6569">ACP</text></g><!--link mcp_clients to mcp_server--><g class="link" data-entity-1="mcp_clients" data-entity-2="mcp_server" data-source-line="74" data-uid="lnk14" id="link_mcp_clients_mcp_server"><path d="M911,59.65 C911,109.33 911,213.5 911,269.28" fill="none" id="mcp_clients-to-mcp_server" style="stroke:#989898;stroke-width:1;"/><polygon fill="#989898" points="911,275.28,915,266.28,911,270.28,907,266.28,911,275.28" style="stroke:#989898;stroke-width:1;"/><text fill="#989898" font-family="'DejaVu Sans Mono'" font-size="13" lengthAdjust="spacing" textLength="23.48" x="912" y="102.6569">MCP</text></g><!--link acp_server to stdio--><g class="link" data-entity-1="acp_server" data-entity-2="stdio" data-source-line="75" data-uid="lnk15" id="link_acp_server_stdio"><path d="M593.34,344.79 C580.2,358.39 571.39,374.8 579,391.48 C584.08,402.64 587.8406,408.4674 596.