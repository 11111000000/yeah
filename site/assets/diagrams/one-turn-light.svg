-- the machine</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="356.4141" x="422.5977" y="223.8516">of the states of a run is the picture</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="154.125" x="422.5977" y="242.4766">beside this one)</text><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="414.9453" x="436.6797" y="276.25"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="288.9844" x="446.6797" y="301.1016">the model proposes a tool call</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="394.9453" x="446.6797" y="319.7266">(read, edit, bash, git_status, todo_list)</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="202.2891" x="446.6797" y="338.3516">lib/yeah-turn.el:1097</text><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="289.7188" x="499.293" y="372.125"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="269.7188" x="509.293" y="396.9766">the registry checks the call</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="221.5547" x="509.293" y="415.6016">(type, name, arguments)</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="202.2891" x="509.293" y="434.2266">lib/yeah-tools.el:435</text><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="212.6563" x="537.8242" y="468"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="173.3906" x="547.8242" y="492.8516">the policy decides</text><text fi