<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1070px" preserveAspectRatio="none" style="width:1320px;height:1070px;background:#FFFFFF;" version="1.1" viewBox="0 0 1320 1070" width="1320px" zoomAndPan="magnify"><defs/><g><ellipse cx="644.1523" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="463.1094" x="412.5977" y="50"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="202.2891" x="422.5977" y="74.8516">one turn of the agent</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="443.1094" x="422.5977" y="93.4766">(the model is asked, the tools are dispatched)</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="202.2891" x="422.5977" y="112.1016">lib/yeah-turn.el:1471</text><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="414.9453" x="436.6797" y="145.875"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="288.9844" x="446.6797" y="170.7266">the model proposes a tool call</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="394.9453" x="446.6797" y="189.3516">(read, edit, bash, git_status, todo_list)</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="202.2891" x="446.6797" y="207.9766">lib/yeah-turn.el:1097</text><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="289.7188" x="499.293" y="241.75"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="269.7188" x="509.293" y="266.6016">the registry checks the call</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="221.5547" x="509.293" y="285.2266">(type, name, arguments)</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="202.2891" x="509.293" y="303.8516">lib/yeah-tools.el:435</text><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="212.6563" x="537.8242" y="337.625"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="173.3906" x="547.8242" y="362.4766">the policy decides</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="192.6563" x="547.8242" y="381.1016">(may this call run?)</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="192.6563" x="547.8242" y="399.7266">lib/yeah-perm.el:528</text><polygon fill="#FFFFFF" points="528.5586,433.5,759.7461,433.5,771.7461,445.5,759.7461,457.5,528.5586,457.5,516.5586,445.5,528.5586,433.5" style="stroke:#999999;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="231.1875" x="528.5586" y="451.0391">the rules ask the person</text><text fill="#333333" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="28.8984" x="487.6602" y="441.7266">yes</text><text fill="#333333" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="19.2656" x="771.7461" y="441.7266">no</text><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="636.5" x="11" y="467.5"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="288.9844" x="21" y="492.3516">the request goes to the person</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="616.5" x="21" y="510.9766">the human answers: :once, :session, :project, :global or :reject</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="221.5547" x="21" y="529.6016">lib/yeah-approval.el:59</text><polygon fill="#FFFFFF" points="247.3711,578.375,411.1289,578.375,423.1289,590.375,411.1289,602.375,247.3711,602.375,235.3711,590.375,247.3711,578.375" style="stroke:#999999;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="163.7578" x="247.3711" y="595.9141">the answer allows</text><text fill="#333333" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="28.8984" x="206.4727" y="586.6016">yes</text><text fill="#333333" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="19.2656" x="423.1289" y="586.6016">no</text><rect fill="#FFFFFF" height="38.625" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="174.125" x="89.7363" y="612.375"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="154.125" x="99.7363" y="637.2266">the call may run</text><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="395.6797" x="283.8613" y="612.375"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="183.0234" x="293.8613" y="637.2266">the call is refused</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="375.6797" x="293.8613" y="655.8516">(the refusal is the result of the call)</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="192.6563" x="293.8613" y="674.4766">lib/yeah-turn.el:474</text><polygon fill="#FFFFFF" points="329.25,694.25,341.25,706.25,329.25,718.25,317.25,706.25,329.25,694.25" style="stroke:#999999;stroke-width:0.5;"/><polygon fill="#FFFFFF" points="872.3594,467.5,1045.75,467.5,1057.75,479.5,1045.75,491.5,872.3594,491.5,860.3594,479.5,872.3594,467.5" style="stroke:#999999;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="173.3906" x="872.3594" y="485.0391">the rules allow it</text><text fill="#333333" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="28.8984" x="831.4609" y="475.7266">yes</text><text fill="#333333" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="19.2656" x="1057.75" y="475.7266">no</text><rect fill="#FFFFFF" height="38.625" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="174.125" x="719.541" y="501.5"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="154.125" x="729.541" y="526.3516">the call may run</text><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#999999;stroke-width:0.5;" width="395.6797" x="913.666" y="501.5"/><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="183.0234" x="923.666" y="526.3516">the call is refused</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="375.6797" x="923.666" y="544.9766">(the refusal is the result of the call)</text><text fill="#000000" font-family="'DejaVu Sans Mono'" font-size="16" lengthAdjust="spacing" textLength="192.6563" x="923.666" y="563.6016">lib/yeah-turn.el:474</text><polygon fill="#FFFFFF" points="959.0547,583.375,971.0547,595.375,959.0547,607.375,947.0547,595.375,959.0547,583.375" style="stroke:#999999;stroke-width:0.5;"/><polygon fill="#FFFFFF" points="644.1523,724.25,656.1523,736.25,644.1523,748.25,632.1523,736.25,644.1523,724.25" style="strok