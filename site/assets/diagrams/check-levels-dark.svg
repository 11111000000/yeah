<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="620px" preserveAspectRatio="none" style="width:837px;height:620px;background:#000000;" version="1.1" viewBox="0 0 837 620" width="837px" zoomAndPan="magnify"><defs/><g><ellipse cx="223.2891" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#000000" height="61.9063" rx="12.5" ry="12.5" style="stroke:#646464;stroke-width:0.5;" width="388.4551" x="29.0615" y="50"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="368.4551" x="39.0615" y="71.1387">the gate of the project runs the checks of the tree</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="260.0859" x="39.0615" y="85.1074">and binds the evidence to the claims</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="86.6953" x="39.0615" y="99.0762">scripts/gate</text><rect fill="#000000" height="61.9063" rx="12.5" ry="12.5" style="stroke:#646464;stroke-width:0.5;" width="395.6797" x="25.4492" y="131.9063"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="28.8984" x="35.4492" y="153.0449">unit</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="375.6797" x="35.4492" y="167.0137">(pure transitions, validation, projections, helpers)</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="72.2461" x="35.4492" y="180.9824">tests/unit</text><rect fill="#000000" height="75.875" rx="12.5" ry="12.5" style="stroke:#646464;stroke-width:0.5;" width="424.5781" x="11" y="213.8125"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="122.8184" x="21" y="234.9512">contract / canary</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="404.5781" x="21" y="248.9199">(the failure classes and the invariants named by claims,</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="354.0059" x="21" y="262.8887">each with a control that can make the check fail)</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="86.6953" x="21" y="276.8574">tests/checks</text><rect fill="#000000" height="75.875" rx="12.5" ry="12.5" style="stroke:#646464;stroke-width:0.5;" width="352.332" x="47.123" y="309.6875"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="79.4707" x="57.123" y="330.8262">integration</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="332.332" x="57.123" y="344.7949">(real gptel, process and protocol round trips,</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="325.1074" x="57.123" y="358.7637">restart, recovery, the whole coding scenario)</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="195.0645" x="57.123" y="372.7324">tests/checks and tests/live</text><rect fill="#000000" height="75.875" rx="12.5" ry="12.5" style="stroke:#646464;stroke-width:0.5;" width="374.0059" x="36.2861" y="405.5625"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="122.8184" x="46.2861" y="426.7012">live / evaluation</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="354.0059" x="46.2861" y="440.6699">(pinned real providers, comparative tasks against</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="260.0859" x="46.2861" y="454.6387">opencode and pi, Emacs-native tasks)</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="72.2461" x="46.2861" y="468.6074">tests/live</text><path d="M397.7813,497.125 L397.7813,528.3906 L377.7813,532.3906 L397.7813,536.3906 L397.7813,567.6563 A0,0 0 0 0 397.7813,567.6563 L825.7676,567.6563 A0,0 0 0 0 825.7676,567.6563 L825.7676,507.125 L815.7676,497.125 L397.7813,497.125 A0,0 0 0 0 397.7813,497.125" fill="#1E1E1E" style="stroke:#646464;stroke-width:0.5;"/><path d="M815.7676,497.125 L815.7676,507.125 L825.7676,507.125 L815.7676,497.125" fill="#1E1E1E" style="stroke:#646464;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="13" lengthAdjust="spacing" textLength="281.7598" x="403.7813" y="514.1919">Still open at the top of the ladder:</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="13" lengthAdjust="spacing" textLength="305.2397" x="403.7813" y="529.3247">no real ACP editor has finished a task,</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="13" lengthAdjust="spacing" textLength="305.2397" x="403.7813" y="544.4575">the clean bootstrap does not run in CI,</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="13" lengthAdjust="spacing" textLength="406.9863" x="403.7813" y="559.5903">and the bridge is off until the operator enables it.</text><rect fill="#000000" height="61.9063" rx="12.5" ry="12.5" style="stroke:#646464;stroke-width:0.5;" width="308.9844" x="68.7969" y="501.4375"/><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="180.6152" x="78.7969" y="522.5762">the boundary of the proof</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="260.0859" x="78.7969" y="536.5449">(every level proves its own subject,</text><text fill="#FFFFFF" font-family="'DejaVu Sans Mono'" font-size="12" lengthAdjust="spacing" textLength="288.9844" x="78.7969" y="550.5137">a green module is not a working product)</text><ellipse cx="223.2891" cy="598.6563" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="223.2891" cy="598.6563" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#989898;stroke-width:1;" x1="223.2891" x2="223.2891" y1="30" y2="50"/><polygon fill="#989898" points="219.2891,40,223.2891,50,227.2891,40,223.2891,44" style="stroke:#989898;stroke-width:1;"/><line style="stroke:#989898;stroke-width:1;" x1="223.2891" x2="223.2891" y1="111.9063" y2="131.9063"/><polygon fill="#989898" points="219.2891,121.9063,223.2891,131.9063,227.2891,121.9063,223.2891,125.9063" style="stroke:#989898;stroke-width:1;"/><line style="stroke:#989898;stroke-width:1;" x1="223.2891" x2="223.2891" y1="193.8125" y2="213.8125"/><polygon fill="#989898" points="219.2891,203.8125,223.2891,213.8125,227.2891,203.8125,223.2891,207.8125" style="stroke:#989898;stroke-width:1;"/><line style="stroke:#989898;stroke-width:1;" x1="223.2891" x2="223.2891" y1="289.6875" y2="309.6875"/><polygon fill="#989898" points="219.2891,299.6875,223.2891,309.6875,227.2891,299.6875,223.2891,303.6875" style="stroke:#989898;stroke-width:1;"/><line style="stroke:#989898;stroke-width:1;" x1="223.2891" x2="223.2891" y1="385.5625" y2="405.5625"/><polygon fill="#989898" points="219.2891,395.5625,223.2891,405.5625,227.2891,395.5625,223.2891,399.5625" style="stroke:#989898;stroke-width:1;"/><line style="stroke:#989898;stroke-width:1;" x1="223.2891" x2="223.2891" y1="481.4375" y2="501.4375"/><polygon fill="#989898" points="219.2891,491.4375,223.2891,501.4375,227.2891,491.4375,223.2891,495.4375" style="stroke:#989898;stroke-width:1;"/><line style="stroke:#989898;stroke-width:1;" x1="223.2891" x2="223.2891" y1="563.3438" y2="587.6563"/><polygon fill="#989898" points="219.2891,577.6563,223.2891,587.6563,227.2891,577.6563,223.2891,581.65