<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- The mark of Yeah: the Y that is the Y-combinator, drawn as the lambda
       of Emacs Lisp.  The file is used as a mask, so the colour of the page
       decides the colour of the mark; the shape is all that is here. -->
  <g fill="none" stroke="#000000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 10.5 L24 26.5"/>
    <path d="M38.5 10.5 L24 26.5"/>
    <path d="M24 26.5 L24 39"/>
  </g>
  <g fill="#000000">
    <circle cx="9.5" cy="10.5" r="3.1"/>
    <circle cx="38.5" cy="10.5" r="3.1"/>
  </g>
</svg>
